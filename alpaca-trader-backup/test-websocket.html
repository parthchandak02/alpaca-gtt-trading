<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .log {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0ff; }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <h1>WebSocket Price Updates Test</h1>
    
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="subscribe()">Subscribe</button>
        <button onclick="unsubscribe()">Unsubscribe</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div>
        <label>Symbols (comma-separated):</label>
        <input type="text" id="symbols" value="AAPL,BTC/USD,TSLA" style="width: 300px; padding: 5px; background: #000; color: #0f0; border: 1px solid #333;">
    </div>
    
    <div>
        <strong>Status:</strong> <span id="status">Disconnected</span>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        let ws = null;
        let reconnectTimeout = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        const RECONNECT_DELAY = 3000;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        function getWebSocketUrl() {
            const hostname = window.location.hostname;
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'ws://localhost:8000/api/ws/prices';
            } else {
                return 'wss://api-trading.parthchandak.info/api/ws/prices';
            }
        }
        
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected', 'info');
                return;
            }
            
            const wsUrl = getWebSocketUrl();
            log(`Connecting to ${wsUrl}...`, 'info');
            updateStatus('Connecting...');
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('✅ Connected to WebSocket', 'success');
                    updateStatus('Connected');
                    reconnectAttempts = 0;
                };
                
                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        const type = message.type;
                        
                        switch (type) {
                            case 'connected':
                                log(`✅ Server confirmed connection: ${message.client_id}`, 'success');
                                break;
                            case 'price_update':
                                const symbols = Object.keys(message.data || {});
                                log(`📊 Price update: ${symbols.length} symbols`, 'success');
                                symbols.forEach(symbol => {
                                    const priceData = message.data[symbol];
                                    log(`  ${symbol}: $${priceData.price} (${priceData.is_market_open ? 'Market Open' : 'Market Closed'})`, 'info');
                                });
                                break;
                            case 'subscribed':
                                log(`✅ Subscribed to: ${message.symbols?.join(', ')}`, 'success');
                                break;
                            case 'unsubscribed':
                                log(`✅ Unsubscribed from: ${message.symbols?.join(', ')}`, 'success');
                                break;
                            case 'heartbeat':
                                log('💓 Heartbeat received', 'info');
                                break;
                            case 'error':
                                log(`❌ Error: ${message.message}`, 'error');
                                break;
                            default:
                                log(`📨 Unknown message type: ${type}`, 'info');
                        }
                    } catch (error) {
                        log(`❌ Error parsing message: ${error}`, 'error');
                    }
                };
                
                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`, 'error');
                };
                
                ws.onclose = (event) => {
                    log(`Connection closed (code: ${event.code}, reason: ${event.reason || 'none'})`, 'info');
                    updateStatus('Disconnected');
                    ws = null;
                    
                    // Attempt reconnect
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        const delay = RECONNECT_DELAY * reconnectAttempts;
                        log(`Reconnecting in ${delay}ms (attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`, 'info');
                        reconnectTimeout = setTimeout(connect, delay);
                    } else {
                        log('❌ Max reconnection attempts reached', 'error');
                    }
                };
            } catch (error) {
                log(`❌ Error creating WebSocket: ${error}`, 'error');
                updateStatus('Error');
            }
        }
        
        function disconnect() {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
            
            if (ws) {
                ws.close(1000, 'Client disconnecting');
                ws = null;
                log('Disconnected', 'info');
                updateStatus('Disconnected');
            }
        }
        
        function subscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ Not connected. Connect first.', 'error');
                return;
            }
            
            const symbolsInput = document.getElementById('symbols').value;
            const symbols = symbolsInput.split(',').map(s => s.trim()).filter(s => s);
            
            if (symbols.length === 0) {
                log('❌ No symbols provided', 'error');
                return;
            }
            
            const message = {
                type: 'subscribe',
                symbols: symbols
            };
            
            ws.send(JSON.stringify(message));
            log(`Subscribing to: ${symbols.join(', ')}`, 'info');
        }
        
        function unsubscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ Not connected. Connect first.', 'error');
                return;
            }
            
            const symbolsInput = document.getElementById('symbols').value;
            const symbols = symbolsInput.split(',').map(s => s.trim()).filter(s => s);
            
            if (symbols.length === 0) {
                log('❌ No symbols provided', 'error');
                return;
            }
            
            const message = {
                type: 'unsubscribe',
                symbols: symbols
            };
            
            ws.send(JSON.stringify(message));
            log(`Unsubscribing from: ${symbols.join(', ')}`, 'info');
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Auto-connect on load
        window.addEventListener('load', () => {
            log('Page loaded. Click Connect to start.', 'info');
        });
    </script>
</body>
</html>
